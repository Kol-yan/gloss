<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>gloss</title>
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header>
      <span class="brand-lockup">
        <img class="brand-tile" src="icons/icon-48.png" width="28" height="28" alt="" />
        <span class="brand-name">gloss</span>
      </span>
      <button id="settings" class="link" type="button">Settings</button>
    </header>

    <p id="account" class="account" role="status" aria-live="polite">Checking your workspace…</p>
    <p id="account-note" class="note" hidden></p>

    <p id="open-app-row" class="open-row" hidden>
      <button id="open-app" class="primary" type="button">Open gloss</button>
    </p>

    <section id="controls-section" aria-label="Extension controls">
      <div class="switch-row">
        <label for="site-off">Check writing on this site</label>
        <span class="switch-site" id="site"></span>
        <input id="site-off" type="checkbox" role="switch" disabled />
      </div>
      <p id="checks-status" class="note" aria-live="polite"></p>

      <div class="switch-row separated">
        <label for="highlight">Highlight My words</label>
        <input id="highlight" type="checkbox" role="switch" disabled />
      </div>
      <p id="highlight-status" class="note" aria-live="polite"></p>
    </section>
  </body>
</html>
