[package]
name = "gloss-desktop"
version = "1.0.0"
description = "gloss for the desktop: check selected text and dictate in any app"
license = "AGPL-3.0-only"
edition = "2024"
rust-version = "1.85"
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows.
name = "gloss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# Without "compression": embedded assets stay plain files in the build
# folder, which the repository's root lint parses like any JavaScript.
tauri = { version = "2.12", default-features = false, features = ["wry", "common-controls-v6", "dynamic-acl", "x11", "dbus", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-log = "2.10"
tauri-plugin-opener = "2.7"
tauri-plugin-single-instance = "2.5"
cpal = "0.18"
log = "0.4"
# The operating system's TLS stack and trust store (Security.framework on
# macOS, SChannel on Windows, OpenSSL on Linux), so corporate roots just work.
reqwest = { version = "0.13", default-features = false, features = ["http2", "json", "multipart", "native-tls", "system-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
url = "2.5"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "block2", "NSEvent", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSScreen", "NSWorkspace"] }
block2 = "0.6"
objc2-application-services = { version = "0.3", default-features = false, features = ["std", "AXError", "AXUIElement", "AXValue", "HIServices", "UniversalAccess", "libc"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFBase", "CFDictionary", "CFNumber", "CFRunLoop", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGEvent", "CGEventSource", "CGEventTypes", "CGRemoteOperation"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSString", "NSURL"] }

# Windows and Linux use the portable clipboard and keystroke crates until they
# get native selection access of their own.
[target.'cfg(not(target_os = "macos"))'.dependencies]
arboard = { version = "3.7", default-features = false }
enigo = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
